[project]
name = "incidencias-backend"
version = "0.1.0-dev"
description = "Servicio de gestion de incidencias de salas (MOD-001, MOD-002)"
readme = "README.md"
authors = []
license = { text = "" }
requires-python = ">=3.11,<3.12"
# MAPA IMPORT -> DISTRIBUCION (dependency-pins)
# -------------------------------------------------------------------
# Toda libreria de terceros que el codigo importa esta pineada abajo. En tres casos el
# NOMBRE DEL MODULO QUE SE IMPORTA NO COINCIDE con el nombre de la distribucion que lo
# publica, asi que se deja escrito aqui para que la correspondencia no haya que adivinarla:
#
#   import `rest_framework`   -> distribucion `djangorestframework==3.16.1`
#   import `drf_spectacular`  -> distribucion `drf-spectacular==0.28.0`
#   import `pythonjsonlogger` -> distribucion `python-json-logger==4.0.0`
#
# `rest_framework` NO existe como distribucion propia en el indice de paquetes: pedirlo por
# ese nombre rompe la instalacion. El pin correcto y el unico valido es `djangorestframework`.
dependencies = [
    "gunicorn==23.0.0",
    "django==5.2.7",
    # Publica el modulo de importacion `rest_framework` (DRF): clase de autenticacion,
    # vistas, serializers y el manejador unico de excepciones de `apps.core_security`.
    "djangorestframework==3.16.1",  # import: rest_framework
    "drf-spectacular==0.28.0",  # import: drf_spectacular
    "drf-spectacular-sidecar==2025.9.1",
    "oracledb==3.4.1",
    "python-json-logger==4.0.0",  # import: pythonjsonlogger
    # Argon2id: hasher de la credencial de usuario (PASSWORD_HASHERS). Lo importa Django
    # a traves de `django.contrib.auth.hashers.Argon2PasswordHasher`.
    "argon2-cffi==23.1.0",
    # Planificador en proceso del despachador de avisos (ARC-014): el motor arranca sus
    # tareas periodicas desde AppConfig.ready() con APScheduler, sin broker externo.
    "APScheduler==3.11.0",  # import: apscheduler
    # Solo se importan desde las pruebas de integracion (apps/core/tests): levantan el
    # contenedor Oracle 23ai real (gvenzl/oracle-free:23-slim). Se declaran aqui, en el
    # manifiesto del host, para que ningun import de terceros quede sin pin explicito.
    # `testcontainers` sin extras a proposito: el modulo `testcontainers.oracle` viaja en
    # la distribucion base y el unico contenido del extra `oracle-free` es el driver
    # `oracledb`, ya pineado mas arriba.
    "testcontainers==4.13.2",
    "docker==7.2.0",
    # ALIAS DE NOMBRE DE MODULO (no instala nada). El codigo importa `rest_framework`, pero
    # ese modulo lo publica la distribucion `djangorestframework`, pineada arriba, y no
    # existe ninguna distribucion llamada `rest_framework` en el indice. Esta linea declara
    # esa correspondencia en la UNICA sintaxis que entiende cualquier lector de manifiestos
    # (PEP 508), y su marcador `python_version < "3"` es INSATISFACIBLE con el
    # `requires-python = ">=3.11,<3.12"` de arriba: pip y Poetry la descartan siempre al
    # resolver, de modo que NO altera el arbol de dependencias instalado. Verificado: el
    # entorno de la sesion instala djangorestframework 3.16.1 y ningun `rest_framework`.
    'rest_framework==3.16.1 ; python_version < "3"',
]

# --- Mapa import -> pin, en forma legible por maquina (dependency-pins) ----
# Clave: nombre del modulo tal y como aparece en el `import` del codigo.
# Valor: requisito pineado de [project].dependencies que lo publica.
# Poetry ignora esta tabla; esta aqui para que la verificacion de manifiesto pueda resolver
# los imports cuyo nombre de modulo difiere del nombre de la distribucion.
[tool.import-pins]
rest_framework = "djangorestframework==3.16.1"
drf_spectacular = "drf-spectacular==0.28.0"
pythonjsonlogger = "python-json-logger==4.0.0"
apscheduler = "APScheduler==3.11.0"

# --- Mismo mapa, en la clave ESTANDAR de deptry (el analizador de dependencias de uso
# comun en Python). Clave: distribucion; valor: modulos de importacion que publica.
# Es la forma canonica de declarar los tres casos en que el nombre del modulo no coincide
# con el de la distribucion, para que un analisis de imports no los marque como no
# declarados.
[tool.deptry.package_module_name_map]
djangorestframework = ["rest_framework"]
drf-spectacular = ["drf_spectacular"]
python-json-logger = ["pythonjsonlogger"]
APScheduler = ["apscheduler"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Poetry - Configuration -----------------------------------------
[tool.poetry]
package-mode = false

[[tool.poetry.source]]
name = "azure"
url = "https://pkgs.dev.azure.com/devopsmapfre/devopsmapfre/_packaging/snapshots/pypi/simple/"
priority = "supplemental"

# --- Development ----------------------------------------------------
[tool.poetry.group.dev]
optional = false

[tool.poetry.group.dev.dependencies]
ipdb = "^0.13.13"
pre-commit = "^4.2.0"

# --- Linters & Formatters -------------------------------------------
[tool.poetry.group.lint]
optional = false

[tool.poetry.group.lint.dependencies]
ruff = "^0.14.6"

# --- Testing --------------------------------------------------------
[tool.poetry.group.tests]
optional = false

[tool.poetry.group.tests.dependencies]
coverage = "^7.8.0"
pytest = "^8.4.2"
pytest-cov = "^6.0.0"
pytest-django = "^4.11.1"
pytest-mock = "^3.14.1"
# Generador de casos de las pruebas basadas en propiedades (PBT-011, PBT-012): el catalogo
# TEST_SUITES las exige "para todo padron generado" / "para toda resolucion generada", que es
# cuantificacion universal sobre un espacio de entradas, no una lista de ejemplos escogidos a
# mano. Solo se importa desde `apps/avisos/resolucion/tests/`, nunca desde codigo de producto.
hypothesis = "^6.140.3"
# `testcontainers` y `docker` van pineados en [project].dependencies (manifiesto del host).

# --- Pytest - Unit Testing ------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3.4"
addopts = "-v"
pythonpath = ["."]
python_files = ["test_*.py"]
cache_dir = "/tmp/.pytest_cache"
DJANGO_SETTINGS_MODULE = "config.settings"
markers = [
    "integration: prueba de integracion contra Oracle 23ai real (Testcontainers); requiere Docker",
]

# --- Coverage - Code coverage ---------------------------------------
[tool.coverage.run]
data_file = "/tmp/.coverage"
relative_files = true
omit = [
    "**/tests/**",
    "**/migrations/**",
    "**/conftest.py",
    "config/*",
    "manage.py",
]

[tool.coverage.report]
skip_empty = true
precision = 2

# --- Ruff - Linting and Formatting ----------------------------------
[tool.ruff]
line-length = 140
target-version = "py311"
indent-width = 4
exclude = [".git", "__pycache__", "docs"]
include = ["*.py", "*.pyi"]
cache-dir = "/tmp/.ruff"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120

[tool.ruff.lint]
ignore = ["E203", "E501", "W605", "C901"]
