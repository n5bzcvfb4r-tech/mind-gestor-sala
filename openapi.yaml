openapi: 3.0.3
info:
  title: incidencias_project — API
  version: 0.1.0
  description: 'Contrato generado por MIND desde los contratos de arquitectura (T.3,
    contract-first PR #0). Paths, verbos y campos de los schemas son LEY; los esquemas
    marcados x-mind-placeholder aún no tienen campos y los completa la construcción
    sin cambiar path/verb.'
servers:
- url: /api
  description: Base pública de la API
paths:
  /auth/sessions:
    post:
      operationId: EP-001
      summary: Inicia sesión con usuario y contraseña propios y devuelve la sesión
        con el rol vigente
      tags:
      - ARC-012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /auth/sessions/current:
    delete:
      operationId: EP-002
      summary: Cierra la sesión del usuario y la revoca en servidor
      tags:
      - ARC-012
      responses:
        '204':
          description: OK
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
    get:
      operationId: EP-003
      summary: Devuelve el contexto del usuario autenticado con su identidad y rol
        vigente
      tags:
      - ARC-012
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
        '401':
          description: No autenticado
        '403':
          description: Prohibido
      x-required-roles: []
      security:
      - bearerAuth: []
      x-mind-access: deny-all
  /auth/permissions:
